[package]
name = "watergaw-wind"
version = "0.1.0"
edition = "2024"
description = "Free wind fields from NOAA weather models: GRIB2 decoding and gridding in Rust, compiled to WebAssembly"
license = "AGPL-3.0-or-later"
repository = "https://github.com/TheOnlyRealAgentP/watergaw-wind"
keywords = ["weather", "wind", "grib2", "noaa", "webassembly"]

[dependencies]
png = "0.18.1"

[dev-dependencies]
serde_json = "1.0.154"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
